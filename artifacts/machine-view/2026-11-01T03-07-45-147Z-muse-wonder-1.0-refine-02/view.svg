<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560"><title>Conveyor Bench operating view</title><desc>Simulated physical truth and observed PLC outputs. Not the PLC HMI.</desc><defs><clipPath id="beltClip"><rect x="70" y="242" width="756" height="36"/></clipPath><linearGradient id="beltGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#475569"/><stop offset="1" stop-color="#1e293b"/></linearGradient></defs><style>.bg{fill:#f1f5f9}.panel{fill:#ffffff;stroke:#94a3b8;stroke-width:1.5}.title{font-family:sans-serif;font-size:20px;font-weight:700;fill:#0f172a}.caption{font-family:sans-serif;font-size:12px;font-weight:700;fill:#b91c1c}.lbl{font-family:sans-serif;font-size:12px;font-weight:600;fill:#0f172a}.small{font-family:sans-serif;font-size:12px;fill:#0f172a}.note{font-family:sans-serif;font-size:12px;fill:#475569}.val{font-family:monospace;font-size:12px;fill:#0f172a}.belt{fill:url(#beltGrad);stroke:#0f172a;stroke-width:1.5}.chute{fill:none;stroke:#64748b;stroke-width:36;stroke-linecap:round;stroke-linejoin:round}.mark{stroke:#e2e8f0;stroke-width:3}.rail{stroke:#334155;stroke-width:2;fill:none}.tick{stroke:#334155;stroke-width:1.5}.peHead{fill:#fef3c7;stroke:#92400e;stroke-width:1.2}.beamLine{stroke:#f59e0b;stroke-width:1.5;stroke-dasharray:4 3}.leader{stroke:#64748b;stroke-width:1.5;fill:none}.callout{fill:#ffffff;stroke:#94a3b8;stroke-width:1.2}.framePlc{fill:none;stroke:#6d28d9;stroke-width:2}.ind{fill:#ffffff;stroke:#64748b;stroke-width:2;stroke-dasharray:4 3}.paddle{fill:#f97316;stroke:#7c2d12;stroke-width:1.5}.paddleLine{stroke:#ffedd5;stroke-width:1.5}.pivot{fill:#0f172a}.cartonBox{fill:#fde68a;stroke:#92400e;stroke-width:1.8}.cartonStripe{fill:#b45309}.cartonTxt{font-family:sans-serif;font-size:12px;font-weight:700;fill:#451a03}.stopBar{fill:#dc2626;stroke:#7f1d1d;stroke-width:1}[data-cb-value="unknown"]{fill:#ffffff;stroke:#64748b;stroke-dasharray:4 3}[data-cb-source="plc"]{stroke:#6d28d9;stroke-width:3}[data-cb-source="world"]{stroke:#0f766e;stroke-width:2.5}[data-cb-source="plc"][data-cb-value="true"]{fill:#7c3aed;stroke:#4c1d95;stroke-width:3;stroke-dasharray:none}[data-cb-source="plc"][data-cb-value="false"]{fill:#ede9fe;stroke:#6d28d9;stroke-width:3;stroke-dasharray:none}[data-cb-source="world"][data-cb-value="true"]{fill:#22c55e;stroke:#0f766e;stroke-width:2.5;stroke-dasharray:none}[data-cb-source="world"][data-cb-value="false"]{fill:#e2e8f0;stroke:#0f766e;stroke-width:2.5;stroke-dasharray:none}.beam[data-cb-value="true"]{fill:#f59e0b;stroke:#92400e;stroke-dasharray:none}.ovlInd[data-cb-value="true"]{fill:#dc2626;stroke:#991b1b;stroke-dasharray:none}.readyInd[data-cb-value="false"]{fill:#fca5a5;stroke:#b91c1c;stroke-dasharray:none}.redInd[data-cb-value="true"]{fill:#ef4444;stroke:#4c1d95;stroke-width:3;stroke-dasharray:none}.redInd[data-cb-value="false"]{fill:#e7e5e4;stroke:#6d28d9;stroke-width:3;stroke-dasharray:none}.grnInd[data-cb-value="true"]{fill:#22c55e;stroke:#4c1d95;stroke-width:3;stroke-dasharray:none}.grnInd[data-cb-value="false"]{fill:#e7e5e4;stroke:#6d28d9;stroke-width:3;stroke-dasharray:none}</style><rect class="bg" x="0" y="0" width="1200" height="560"/><text class="title" x="24" y="30">Conveyor Bench - Operating View</text><text class="caption" x="24" y="50">NOT the PLC HMI - shows SIMULATED PHYSICAL TRUTH (world) and OBSERVED PLC OUTPUTS only. No controls, no command authority.</text><text class="small" x="24" y="68">PLC observed: violet squares / frames, purple ON. World truth: teal circles, green or amber ON. Unknown: white dashed. OFF: pale solid.</text><text class="note" x="70" y="88">Off-lane status lamps and labels are kept clear of the belt and chute carton paths.</text><g data-cb-equipment="mainLane" id="lane_main"><polyline class="chute" points="358,260 366.95,260.94 375.75,262.81 384.31,265.59 392.54,269.25 400.33,273.75 407.61,279.04 414.9,284.33 436.74,300.2 524.11,363.67"/><polyline class="chute" points="574,260 582.95,260.94 591.75,262.81 600.31,265.59 608.54,