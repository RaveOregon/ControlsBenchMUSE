" width="12" height="12" rx="2"/><line class="beamLine" x1="0" y1="-22" x2="0" y2="22"/><g transform="rotate(-36)"><line class="leader" x1="-70" y1="52" x2="-14" y2="-2"/><circle class="ind beam" id="pe_exitb_beam" cx="-80" cy="62" r="7"/><text class="small" x="-66" y="66">PE Exit B</text></g></g><g data-cb-equipment="exitB" id="exitb_g" transform="translate(740.11 363.67) rotate(36)"><rect class="stopBar" x="14" y="-20" width="6" height="40"/><g transform="rotate(-36)"><line class="leader" x1="-70" y1="52" x2="-14" y2="-2"/><circle class="ind readyInd" id="exitb_ready_ind" cx="-80" cy="62" r="7"/><text class="small" x="-66" y="66">Exit B Ready</text></g></g><g data-cb-equipment="peRunout" id="pe_runout_g" transform="translate(718 260)"><line class="leader" x1="0" y1="-41" x2="0" y2="-34"/><rect class="peHead" x="-6" y="-34" width="12" height="12" rx="2"/><line class="beamLine" x1="0" y1="-22" x2="0" y2="22"/><circle class="ind beam" id="pe_runout_beam" cx="0" cy="-48" r="7"/><text class="lbl" x="0" y="-66" text-anchor="middle">PE Runout 3.6m</text></g><g data-cb-equipment="runout" id="runout_g" transform="translate(826 260)"><rect class="stopBar" x="10" y="-22" width="7" height="44"/><line class="leader" x1="-35" y1="50" x2="-8" y2="12"/><circle class="ind readyInd" id="runout_ready_ind" cx="-42" cy="58" r="7"/><text class="small" x="-28" y="62">Runout Ready</text></g><rect class="panel" x="948" y="78" width="234" height="434" rx="8"/><text class="lbl" x="964" y="100">Side panel</text><text class="small" x="964" y="118">No measured location implied</text><g data-cb-equipment="drive" id="drive_g"><text class="lbl" x="964" y="144">Belt drive</text><rect class="ind" id="drive_cmd_ind" x="964" y="154" width="14" height="14"/><text class="small" x="984" y="166">PLC Motor_RunCmd</text><circle class="ind" id="drive_run_ind" cx="971" cy="186" r="7"/><text class="small" x="984" y="190">World RunningFB</text><circle class="ind ovlInd" id="drive_ovl_ind" cx="971" cy="208" r="7"/><text class="small" x="984" y="212">World Overload</text><text class="small" x="964" y="238">Speed m/s (world)</text><text class="val" id="speed_val" x="1170" y="238" text-anchor="end">unknown</text><text class="small" x="964" y="260">Current A (world)</text><text class="val" id="current_val" x="1170" y="260" text-anchor="end">unknown</text></g><g data-cb-equipment="encoder" id="encoder_g"><text class="lbl" x="964" y="292">Belt encoder</text><text class="small" x="964" y="316">Count (world)</text><text class="val" id="encoder_val" x="1170" y="316" text-anchor="end">unknown</text><text class="small" x="964" y="336">1000 counts/m, wraps 2^32</text><text class="small" x="964" y="354">Belt marks move from this only</text></g><g data-cb-equipment="stackLight" id="stack_g"><text class="lbl" x="964" y="386">Stack light (PLC observed)</text><rect class="framePlc" x="972" y="396" width="32" height="32"/><circle class="ind redInd" id="stack_red_ind" cx="988" cy="412" r="13"/><text class="small" x="1012" y="416">Red</text><rect class="framePlc" x="972" y="434" width="32" height="32"/><circle class="ind grnInd" id="stack_green_ind" cx="988" cy="450" r="13"/><text class="small" x="1012" y="454">Green</text></g><text class="small" x="964" y="486">World = teal circles (sim truth)</text><text class="small" x="964" y="504">PLC = violet squares / frames</text><text class="small" x="24" y="540">Flow: Entry, D1 approach, Divert 1 / Exit A, D2 approach, Divert 2 / Exit B, Runout. Cartons are host-supplied entities; none drawn statically.</text><g id="carton_template"><rect class="cartonBox" x="-27" y="-16" width="54" height="32" rx="3"/><rect class="cartonStripe" x="-27" y="-16" width="54" height="5"/><text class="cartonTxt" x="0" y="7" text-anchor="middle" data-cb-field="itemId">item</text></g><g id="carton_container"></g></svg>