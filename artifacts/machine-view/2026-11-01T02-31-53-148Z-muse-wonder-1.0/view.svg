pment="peRunout" id="pe_runout_g" transform="translate(800 300)"><rect class="peHead" x="-6" y="-40" width="12" height="12" rx="2"/><line class="beamLine" x1="0" y1="-28" x2="0" y2="28"/><circle class="beam" id="pe_runout_beam" cx="0" cy="0" r="7"/><text class="tiny" x="0" y="52" text-anchor="middle">PE Runout 3.6m</text></g><g data-cb-equipment="runout" id="runout_g" transform="translate(920 300)"><rect class="stopBar" x="10" y="-22" width="7" height="44"/><circle class="readyInd" id="runout_ready_ind" cx="-12" cy="0" r="8"/><text class="tiny" x="0" y="40" text-anchor="middle">Runout Ready</text></g><rect class="panel" x="950" y="80" width="232" height="430" rx="8"/><text class="lbl" x="966" y="104">Side panel</text><text class="tiny" x="966" y="118">No measured location implied</text><g data-cb-equipment="drive" id="drive_g"><text class="lbl" x="966" y="146">Belt drive</text><rect class="plcInd" id="drive_cmd_ind" x="966" y="156" width="14" height="14"/><text class="small" x="986" y="167">PLC Motor_RunCmd</text><circle class="worldInd" id="drive_run_ind" cx="973" cy="186" r="7"/><text class="small" x="986" y="190">World RunningFB</text><circle class="ovlInd" id="drive_ovl_ind" cx="973" cy="208" r="7"/><text class="small" x="986" y="212">World Overload</text><text class="small" x="966" y="236">Speed m/s:</text><text class="val" id="speed_val" x="1040" y="236">unknown</text><text class="small" x="966" y="256">Current A:</text><text class="val" id="current_val" x="1040" y="256">unknown</text></g><g data-cb-equipment="encoder" id="encoder_g"><text class="lbl" x="966" y="292">Belt encoder</text><text class="small" x="966" y="312">Count:</text><text class="val" id="encoder_val" x="1012" y="312">unknown</text><text class="tiny" x="966" y="328">1000 counts/m, wraps 2^32</text><text class="tiny" x="966" y="342">Belt marks move from this only</text></g><g data-cb-equipment="stackLight" id="stack_g"><text class="lbl" x="966" y="378">Stack light (PLC observed)</text><circle class="redInd" id="stack_red_ind" cx="990" cy="406" r="14"/><text class="small" x="1012" y="410">Red</text><circle class="grnInd" id="stack_green_ind" cx="990" cy="444" r="14"/><text class="small" x="1012" y="448">Green</text></g><text class="tiny" x="966" y="492">World = simulated truth</text><text class="tiny" x="24" y="540">Flow: Entry, D1 approach, Divert1/A, D2 approach, Divert2/B, Runout. Cartons are host-supplied entities, none drawn statically.</text></svg>