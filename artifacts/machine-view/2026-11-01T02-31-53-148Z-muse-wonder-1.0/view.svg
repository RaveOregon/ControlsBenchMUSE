"/><line x1="-30" y1="0" x2="30" y2="0" stroke="#92400e" stroke-width="1"/><text class="cartonTxt" x="0" y="-2" text-anchor="middle" data-cb-field="itemId">item</text><text class="tiny" x="0" y="11" text-anchor="middle" data-cb-field="requestedRoute">route</text></g><g data-cb-equipment="peEntry" id="pe_entry_g" transform="translate(180 300)"><rect class="peHead" x="-6" y="-40" width="12" height="12" rx="2"/><line class="beamLine" x1="0" y1="-28" x2="0" y2="28"/><circle class="beam" id="pe_entry_beam" cx="0" cy="0" r="7"/><text class="tiny" x="0" y="52" text-anchor="middle">PE Entry 0.5m</text></g><g data-cb-equipment="peD1Approach" id="pe_d1_g" transform="translate(320 300)"><rect class="peHead" x="-6" y="-40" width="12" height="12" rx="2"/><line class="beamLine" x1="0" y1="-28" x2="0" y2="28"/><circle class="beam" id="pe_d1_beam" cx="0" cy="0" r="7"/><text class="tiny" x="0" y="52" text-anchor="middle">PE D1 Appr 1.2m</text></g><g data-cb-equipment="divert1" id="divert1_g" transform="translate(400 300)"><circle class="pivot" cx="-18" cy="-20" r="5"/><g id="d1_paddle"><rect class="paddle" x="-18" y="-24" width="70" height="8" rx="3"/></g><rect class="plcInd" id="d1_cmd_ind" x="-34" y="30" width="13" height="13"/><text class="tiny" x="-18" y="40">PLC cmd</text><circle class="worldInd" id="d1_home_ind" cx="8" cy="36" r="6"/><text class="tiny" x="17" y="40">Home</text><circle class="worldInd" id="d1_ext_ind" cx="48" cy="36" r="6"/><text class="tiny" x="57" y="40">Ext</text><text class="tiny" x="86" y="40">Pos%</text><text class="val" id="d1_pos_val" x="118" y="40">unknown</text><text class="lbl" x="-18" y="-34">Divert 1 to A</text></g><g data-cb-equipment="peD2Approach" id="pe_d2_g" transform="translate(560 300)"><rect class="peHead" x="-6" y="-40" width="12" height="12" rx="2"/><line class="beamLine" x1="0" y1="-28" x2="0" y2="28"/><circle class="beam" id="pe_d2_beam" cx="0" cy="0" r="7"/><text class="tiny" x="0" y="52" text-anchor="middle">PE D2 Appr 2.4m</text></g>