<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560"><title>Conveyor Bench operating view</title><desc>Simulated physical truth and observed PLC outputs. Not the PLC HMI.</desc><defs><clipPath id="beltClip"><rect x="72" y="283" width="856" height="34"/></clipPath><linearGradient id="beltGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#475569"/><stop offset="1" stop-color="#1e293b"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><style>.bg{fill:#f1f5f9}.panel{fill:#ffffff;stroke:#94a3b8;stroke-width:1.5}.title{font-family:sans-serif;font-size:21px;font-weight:700;fill:#0f172a}.caption{font-family:sans-serif;font-size:11px;fill:#b91c1c}.lbl{font-family:sans-serif;font-size:12px;fill:#0f172a}.small{font-family:sans-serif;font-size:10px;fill:#475569}.tiny{font-family:sans-serif;font-size:9px;fill:#475569}.val{font-family:monospace;font-size:12px;fill:#0f172a}.belt{fill:url(#beltGrad);stroke:#0f172a;stroke-width:1.5}.chute{fill:none;stroke:#64748b;stroke-width:36;stroke-linecap:round;stroke-linejoin:round}.chuteEdge{fill:none;stroke:#0f172a;stroke-width:1.2}.mark{stroke:#e2e8f0;stroke-width:3}.rail{stroke:#334155;stroke-width:2;fill:none}.peHead{fill:#fef3c7;stroke:#92400e;stroke-width:1.2}.beamLine{stroke:#f59e0b;stroke-width:1.5;stroke-dasharray:4 3}.beam{fill:#ffffff;stroke:#64748b;stroke-width:1.5;stroke-dasharray:3 2}.beam[data-cb-value="false"]{fill:#cbd5e1;stroke:#64748b;stroke-dasharray:none}.beam[data-cb-value="true"]{fill:#f59e0b;stroke:#92400e;stroke-dasharray:none}.plcInd{fill:#ffffff;stroke:#7e22ce;stroke-width:1.8;stroke-dasharray:3 2}.plcInd[data-cb-value="false"]{fill:#e2e8f0;stroke-dasharray:none}.plcInd[data-cb-value="true"]{fill:#a855f7;stroke-dasharray:none}.worldInd{fill:#ffffff;stroke:#0f766e;stroke-width:1.6;stroke-dasharray:3 2}.worldInd[data-cb-value="false"]{fill:#cbd5e1;stroke-dasharray:none}.worldInd[data-cb-value="true"]{fill:#22c55e;stroke-dasharray:none}.ovlInd{fill:#ffffff;stroke:#b91c1c;stroke-width:1.6;stroke-dasharray:3 2}.ovlInd[data-cb-value="false"]{fill:#cbd5e1;stroke-dasharray:none}.ovlInd[data-cb-value="true"]{fill:#ef4444;stroke-dasharray:none}.readyInd{fill:#ffffff;stroke:#0f766e;stroke-width:1.6;stroke-dasharray:3 2}.readyInd[data-cb-value="false"]{fill:#ef4444;stroke-dasharray:none}.readyInd[data-cb-value="true"]{fill:#22c55e;stroke-dasharray:none}.redInd{fill:#ffffff;stroke:#b91c1c;stroke-width:2;stroke-dasharray:3 2}.redInd[data-cb-value="false"]{fill:#fecaca;stroke-dasharray:none}.redInd[data-cb-value="true"]{fill:#dc2626;stroke-dasharray:none}.grnInd{fill:#ffffff;stroke:#15803d;stroke-width:2;stroke-dasharray:3 2}.grnInd[data-cb-value="false"]{fill:#bbf7d0;stroke-dasharray:none}.grnInd[data-cb-value="true"]{fill:#16a34a;stroke-dasharray:none}.paddle{fill:#f97316;stroke:#7c2d12;stroke-width:1.5}.pivot{fill:#0f172a}.cartonBox{fill:#fde68a;stroke:#92400e;stroke-width:1.8}.cartonTxt{font-family:sans-serif;font-size:10px;font-weight:700;fill:#451a03}.stopBar{fill:#dc2626;stroke:#7f1d1d;stroke-width:1}</style><rect class="bg" x="0" y="0" width="1200" height="560"/><text class="title" x="24" y="30">Conveyor Bench — Operating View</text><text class="caption" x="24" y="48">NOT the PLC HMI — shows SIMULATED PHYSICAL TRUTH (world) and OBSERVED PLC OUTPUTS only. No controls, no command authority.</text><text class="small" x="24" y="66">Purple squares = observed PLC outputs. Circles = world truth. White dashed = unknown (no snapshot yet), distinct from false (grey).</text><g data-cb-equipment="mainLane" id="lane_main"><polyline class="chute" points="400,300 482,357 580,426"/><polyline class="chute" points="640,300 722,357 820,426"/><rect class="belt" x="70" y="282" width="860" height="36" rx="4"/><g clip-path="url(#beltClip)"><g id="belt_marks"><line class="mark" x1="30" y1="285" x2="30" y2="315"/><line class="mark" x1="70" y