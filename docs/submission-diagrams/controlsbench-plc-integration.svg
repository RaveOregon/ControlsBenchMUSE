<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc"><title id="title">Agnostic connector and PLC integration contract</title><desc id="desc">The workstation world and selected connection adapter exchange typed raw inputs and authentic controller commands with a platform-specific PLC library. Generic input interception, existing application, output observation and optional sink override are separate. Demo selections are OPC UA, CODESYS Control Win and integrated M8 FB; the reusable Core is compiled only.</desc><defs><style>text{font-family:"Segoe UI",Arial,sans-serif}</style><marker id="a3275C6" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 8 4 0 8Z" fill="#3275C6"/></marker><marker id="a138B83" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 8 4 0 8Z" fill="#138B83"/></marker><marker id="a7754D9" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 8 4 0 8Z" fill="#7754D9"/></marker><marker id="aB7791F" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 8 4 0 8Z" fill="#B7791F"/></marker></defs><rect width="1920" height="1080" fill="white"/><text x="56" y="68" font-size="44" fill="#132238" font-weight="700" text-anchor="start">One integration contract, platform-specific adapters</text><text x="56" y="110" font-size="24" fill="#526176" font-weight="400" text-anchor="start">The connector and PLC library implement shared behavior; the demo supplies concrete selections.</text><rect x="48" y="150" width="382" height="550" rx="16" fill="#F2F7FD" stroke="#B8D0ED" stroke-width="2"/><text x="78" y="201" font-size="28" fill="#3275C6" font-weight="700" text-anchor="start">ControlsBench engine</text><text x="78" y="238" font-size="21" fill="#132238" font-weight="400" text-anchor="start">World + connected services</text><rect x="78" y="280" width="322" height="125" rx="16" fill="#FFF" stroke="#3275C6" stroke-width="2"/><text x="100" y="319" font-size="24" fill="#132238" font-weight="650" text-anchor="start">Generated environment</text><text x="100" y="355" font-size="21" fill="#526176" font-weight="400" text-anchor="start">Physics · devices · faults</text><text x="100" y="384" font-size="19" fill="#526176" font-weight="400" text-anchor="start">Raw/native signal values</text><rect x="78" y="435" width="322" height="120" rx="16" fill="#FFF" stroke="#3275C6" stroke-width="2"/><text x="100" y="469" font-size="24" fill="#132238" font-weight="650" text-anchor="start">Connection adapter</text><rect x="95" y="486" width="288" height="54" rx="9" fill="#F3F7FB" stroke="#D5DFEA" stroke-width="2"/><text x="107" y="505" font-size="12" fill="#3275C6" font-weight="700" text-anchor="start">DEMO SELECTION</text><text x="107" y="527" font-size="19" fill="#132238" font-weight="600" text-anchor="start">OPC UA</text><path d="M239 405V435" fill="none" stroke="#3275C6" stroke-width="3" stroke-linejoin="round" marker-end="url(#a3275C6)"/><path d="M112 435V405" fill="none" stroke="#138B83" stroke-width="3" stroke-linejoin="round" marker-end="url(#a138B83)"/><text x="78" y="610" font-size="21" fill="#3275C6" font-weight="600" text-anchor="start">Interface: typed raw I/O</text><text x="78" y="645" font-size="19" fill="#526176" font-weight="400" text-anchor="start">Device data + service messages</text><text x="78" y="677" font-size="18" fill="#526176" font-weight="400" text-anchor="start">Behavior stays on the workstation.</text><rect x="474" y="150" width="1398" height="550" rx="16" fill="#F5FBFA" stroke="#A8D4CF" stroke-width="2"/><text x="506" y="199" font-size="28" fill="#138B83" font-weight="700" text-anchor="start">Controller platform</text><rect x="1460" y="170" width="380" height="54" rx="9" fill="#F3F7FB" stroke="#D5DFEA" stroke-width="2"/><text x="1472" y="189" font-size="12" fill="#138B83" font-weight="700" text-anchor="start">DEMO SELECTION</text><text x="1472" y="211" font-size="19" fill="#132238" font-weight="600" text-anchor="start">CODESYS Control Win</text><rect x="520" y="230" width="280" height="80" rx="16" fill="#FFF" stroke="#D5DFEA" stroke-width="2"/><text x="660" y="264" font-size="23" fill="#132238" font-weight="650" text-anchor="middle">Native input acquisition</text><text x="660" y="294" font-size="19" fill="#526176" font-weight="400" text-anchor="middle">Hardware raw DI / AI</text><rect x="860" y="330" width="286" height="142" rx="16" fill="#FFF" stroke="#138B83" stroke-width="2"/><text x="1003" y="366" font-size="23" fill="#132238" font-weight="650" text-anchor="middle">PLC input interceptor(s)</text><text x="1003" y="401" font-size="18" fill="#526176" font-weight="400" text-anchor="middle">Normal: hardware passthrough</text><text x="1003" y="434" font-size="18" fill="#526176" font-weight="400" text-anchor="middle">Simulation: workstation image</text><rect x="1204" y="330" width="298" height="142" rx="16" fill="#138B83" stroke="#138B83" stroke-width="2"/><text x="1353" y="367" font-size="25" fill="#FFF" font-weight="650" text-anchor="middle">Existing application</text><text x="1353" y="405" font-size="22" fill="#FFF" font-weight="400" text-anchor="middle">Scaling · filtering</text><text x="1353" y="439" font-size="22" fill="#FFF" font-weight="400" text-anchor="middle">Sequence · control</text><rect x="1560" y="330" width="276" height="142" rx="16" fill="#FFF" stroke="#138B83" stroke-width="2"/><text x="1698" y="367" font-size="24" fill="#132238" font-weight="650" text-anchor="middle">Output observer(s)</text><text x="1698" y="406" font-size="20" fill="#526176" font-weight="400" text-anchor="middle">Native command values</text><text x="1698" y="439" font-size="20" fill="#526176" font-weight="400" text-anchor="middle">DO / AO contract</text><path d="M800 270H1003V330" fill="none" stroke="#138B83" stroke-width="3" stroke-linejoin="round" marker-end="url(#a138B83)"/><text x="900" y="253" font-size="19" fill="#138B83" font-weight="600" text-anchor="start">Default</text><path d="M400 490H450V390H860" fill="none" stroke="#3275C6" stroke-width="3" stroke-linejoin="round" marker-end="url(#a3275C6)"/><text x="640" y="373" font-size="20" fill="#3275C6" font-weight="600" text-anchor="middle">Complete simulated input image</text><path d="M1146 402H1204" fill="none" stroke="#138B83" stroke-width="3" stroke-linejoin="round" marker-end="url(#a138B83)"/><path d="M1502 402H1560" fill="none" stroke="#138B83" stroke-width="3" stroke-linejoin="round" marker-end="url(#a138B83)"/><path d="M1576 472V510H415V540H400" fill="none" stroke="#138B83" stroke-width="3" stroke-linejoin="round" marker-end="url(#a138B83)"/><rect x="695" y="490" width="600" height="34" rx="4" fill="#F5FBFA" stroke="#F5FBFA" stroke-width="2"/><text x="995" y="515" font-size="21" fill="#138B83" font-weight="600" text-anchor="middle">Authentic commands / status → world response</text><rect x="520" y="550" width="755" height="115" rx="16" fill="#FFFAF1" stroke="#E7CA94" stroke-width="2"/><text x="544" y="584" font-size="24" fill="#B7791F" font-weight="650" text-anchor="start">Shared session and signal contract</text><text x="544" y="620" font-size="19" fill="#526176" font-weight="400" text-anchor="start">Types · direction · identity · version · applied-image ack · freshness</text><text x="544" y="650" font-size="20" fill="#526176" font-weight="400" text-anchor="start">Link loss: hold last image + bench diagnostic</text><rect x="1542" y="542" width="312" height="76" rx="12" fill="#FFFCF6" stroke="#B7791F" stroke-width="2" stroke-dasharray="7 5"/><text x="1698" y="572" font-size="21" fill="#132238" font-weight="600" text-anchor="middle">Optional physical-sink gate</text><text x="1698" y="601" font-size="16" fill="#526176" font-weight="400" text-anchor="middle">Platform capability; default pass-through</text><path d="M1698 472V542" fill="none" stroke="#138B83" stroke-width="3" stroke-linejoin="round" marker-end="url(#a138B83)"/><rect x="1560" y="647" width="276" height="40" rx="10" fill="#E4EFED" stroke="#E4EFED" stroke-width="2"/><text x="1698" y="674" font-size="20" fill="#132238" font-weight="400" text-anchor="middle">Native hardware outputs</text><path d="M1698 618V647" fill="none" stroke="#138B83" stroke-width="3" stroke-linejoin="round" marker-end="url(#a138B83)"/><text x="48" y="753" font-size="29" fill="#132238" font-weight="700" text-anchor="start">Common semantics. Configurable connector. Platform-specific library.</text><text x="48" y="788" font-size="21" fill="#526176" font-weight="400" text-anchor="start">I/O-type, channel or centralized blocks follow the same versioned contract, according to platform capability.</text><rect x="48" y="811" width="405" height="62" rx="16" fill="#F5F7FA" stroke="#D5DFEA" stroke-width="2"/><text x="250.5" y="850" font-size="21" fill="#132238" font-weight="400" text-anchor="middle">Specification + I/O / services</text><path d="M453 842H518" fill="none" stroke="#3275C6" stroke-width="3" stroke-linejoin="round" marker-end="url(#a3275C6)"/><rect x="518" y="811" width="405" height="62" rx="16" fill="#F5F7FA" stroke="#D5DFEA" stroke-width="2"/><text x="720.5" y="850" font-size="21" fill="#132238" font-weight="400" text-anchor="middle">Versioned contract + mapping</text><path d="M923 842H988" fill="none" stroke="#3275C6" stroke-width="3" stroke-linejoin="round" marker-end="url(#a3275C6)"/><rect x="988" y="811" width="405" height="62" rx="16" fill="#F5F7FA" stroke="#D5DFEA" stroke-width="2"/><text x="1190.5" y="850" font-size="21" fill="#132238" font-weight="400" text-anchor="middle">Platform library / FB adapter</text><path d="M1393 842H1458" fill="none" stroke="#3275C6" stroke-width="3" stroke-linejoin="round" marker-end="url(#a3275C6)"/><rect x="1458" y="811" width="414" height="62" rx="16" fill="#F5F7FA" stroke="#D5DFEA" stroke-width="2"/><text x="1665" y="850" font-size="21" fill="#132238" font-weight="400" text-anchor="middle">Selected connector profile</text><rect x="48" y="904" width="574" height="110" rx="16" fill="#F0F8F6" stroke="#138B83" stroke-width="2"/><text x="69" y="933" font-size="15" fill="#138B83" font-weight="700" text-anchor="start">POPULATED DEMO</text><text x="69" y="965" font-size="22" fill="#132238" font-weight="400" text-anchor="start">CODESYS · OPC UA · integrated M8 FB</text><text x="69" y="995" font-size="18" fill="#526176" font-weight="400" text-anchor="start">Raw input selection + Boolean output capture</text><rect x="673" y="904" width="574" height="110" rx="14" fill="#FFFCF6" stroke="#B7791F" stroke-width="2" stroke-dasharray="7 5"/><text x="694" y="933" font-size="15" fill="#B7791F" font-weight="700" text-anchor="start">REUSABLE IMPLEMENTATION — COMPILED</text><text x="694" y="965" font-size="22" fill="#132238" font-weight="400" text-anchor="start">Core 0.2.0.0 · DI / AI / DO / AO</text><text x="694" y="995" font-size="18" fill="#526176" font-weight="400" text-anchor="start">Not deployed; optional sink gate is prototype</text><rect x="1298" y="904" width="574" height="110" rx="14" fill="#F8F9FB" stroke="#8B98A9" stroke-width="2" stroke-dasharray="3 6"/><text x="1319" y="933" font-size="15" fill="#526176" font-weight="700" text-anchor="start">ADDITIONAL BINDINGS / EXTENSIONS</text><text x="1319" y="965" font-size="21" fill="#132238" font-weight="400" text-anchor="start">Other platforms and transports need adapters</text><text x="1319" y="995" font-size="18" fill="#526176" font-weight="400" text-anchor="start">Acquisition / recording → PID and signal analysis</text><text x="48" y="1054" font-size="18" fill="#526176" font-weight="400" text-anchor="start">PLC integration requires an editable / rebuildable project. Named demo choices do not define the platform-neutral contract.</text></svg>
