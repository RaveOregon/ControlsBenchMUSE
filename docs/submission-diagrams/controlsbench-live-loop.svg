<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">How a live ControlsBench investigation works</title>
  <desc id="desc">Five lanes separate Muse Wonder, campaign runtime and evidence, an isolated generated-world engine, OPC UA and the actual CODESYS PLC. Setup creates and validates the world. The workstation then streams complete raw input images at the demo's qualified 10 Hz transport point and receives applied acknowledgements and authentic outputs while Muse reasons asynchronously. A six-step live investigation moves from drive-feedback fault 12 through recovery to an evidence-dependent D1 contradiction test, fault 21, recovery, and two findings with 31 verified PLC claims.</desc>
  <defs>
    <style>
      text{font-family:Inter,"Segoe UI",Arial,sans-serif;fill:#132238}
      .title{font-size:45px;font-weight:730;letter-spacing:-1.2px}
      .subtitle{font-size:25px;fill:#526176}
      .section{font-size:18px;font-weight:750;letter-spacing:1.8px}
      .lane{font-size:25px;font-weight:700}
      .lane-sub{font-size:19px;fill:#526176}
      .label{font-size:22px;font-weight:600}
      .body{font-size:23px;fill:#405168}
      .small{font-size:20px;fill:#526176}
      .card-title{font-size:24px;font-weight:700}
      .card-copy{font-size:23px;fill:#405168}
      .tag{font-size:18px;font-weight:700;letter-spacing:.4px}
      .lifeline{stroke:#DCE4EE;stroke-width:2;stroke-dasharray:5 9}
      .arrow{stroke-width:3;fill:none;stroke-linecap:round}
    </style>
    <marker id="purple-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 10 5 0 10Z" fill="#7754D9"/></marker>
    <marker id="blue-arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 11 5.5 0 11Z" fill="#3275C6"/></marker>
    <marker id="teal-arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 11 5.5 0 11Z" fill="#138B83"/></marker>
    <marker id="amber-arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 11 5.5 0 11Z" fill="#B7791F"/></marker>
    <marker id="grey-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 10 5 0 10Z" fill="#9AA9BB"/></marker>
  </defs>
  <rect width="1920" height="1080" fill="#FFFFFF"/>
  <rect x="64" y="48" width="6" height="55" rx="3" fill="#7754D9"/>
  <text x="92" y="88" class="title">How a live ControlsBench investigation works</text>
  <text x="92" y="126" class="subtitle">Muse chooses the experiments. The workstation maintains the world. The real PLC supplies the response.</text>

  <!-- Ownership lanes; the model and continuous field loop have separate responsibilities. -->
  <rect x="64" y="158" width="328" height="74" rx="12" fill="#F3EFFC" stroke="#DFD5F7"/>
  <rect x="424" y="158" width="328" height="74" rx="12" fill="#FFFAEE" stroke="#EEDDB7"/>
  <rect x="784" y="158" width="328" height="74" rx="12" fill="#EEF5FD" stroke="#CADDF4"/>
  <rect x="1144" y="158" width="328" height="74" rx="12" fill="#EEF5FD" stroke="#CADDF4"/>
  <rect x="1504" y="158" width="352" height="74" rx="12" fill="#EDF8F6" stroke="#C2E4DF"/>
  <text x="228" y="189" text-anchor="middle" class="lane" style="fill:#7754D9">Muse Wonder</text><text x="228" y="216" text-anchor="middle" class="lane-sub">Meta API · reasoning</text>
  <text x="588" y="189" text-anchor="middle" class="lane">Campaign runtime</text><text x="588" y="216" text-anchor="middle" class="lane-sub">Tools + evidence</text>
  <text x="948" y="189" text-anchor="middle" class="lane">Isolated world engine</text><text x="948" y="216" text-anchor="middle" class="lane-sub">Generated TypeScript</text>
  <text x="1308" y="189" text-anchor="middle" class="lane">OPC UA connector</text><text x="1308" y="216" text-anchor="middle" class="lane-sub">Raw images + observations</text>
  <text x="1680" y="189" text-anchor="middle" class="lane" style="fill:#138B83">Actual PLC application</text><text x="1680" y="216" text-anchor="middle" class="lane-sub">CODESYS Control Win</text>
  <g class="lifeline"><path d="M228 232V612"/><path d="M588 232V612"/><path d="M948 232V612"/><path d="M1308 232V612"/><path d="M1680 232V612"/></g>

  <!-- Setup is finite; field execution below is continuous. -->
  <text x="64" y="268" class="section" style="fill:#7754D9">SETUP</text>
  <rect x="64" y="281" width="328" height="45" rx="22" fill="#FFFFFF" stroke="#D6C9F2"/>
  <text x="228" y="310" text-anchor="middle" class="label">Engineer: spec + I/O</text>
  <text x="500" y="267" text-anchor="middle" class="label">Author reactive world</text>
  <path d="M392 291H588" class="arrow" stroke="#7754D9" marker-end="url(#purple-arrow)"/>
  <text x="768" y="267" text-anchor="middle" class="label">Validate + start</text>
  <path d="M588 291H948" class="arrow" stroke="#3275C6" marker-end="url(#blue-arrow)"/>
  <circle cx="588" cy="291" r="6" fill="#B7791F"/>

  <rect x="64" y="350" width="1792" height="264" rx="17" fill="#F8FAFD" stroke="#D9E4F0" stroke-width="2"/>
  <text x="88" y="384" class="section" style="fill:#3275C6">CONTINUOUS WORKSTATION EXECUTION · DEMO TRANSPORT 10 Hz</text>
  <g class="lifeline"><path d="M228 401V595"/><path d="M588 401V595"/><path d="M948 401V595"/><path d="M1308 401V595"/><path d="M1680 401V595"/></g>
  <rect x="103" y="427" width="250" height="128" rx="14" fill="#F3EFFC" stroke="#DED3F5"/>
  <text x="228" y="460" text-anchor="middle" class="label" style="fill:#7754D9">Async model turns</text>
  <text x="228" y="495" text-anchor="middle" class="body">Reasons between</text><text x="228" y="525" text-anchor="middle" class="body">semantic decisions</text>
  <text x="588" y="440" text-anchor="middle" class="label" style="fill:#B7791F">Keep the evidence</text>
  <text x="588" y="474" text-anchor="middle" class="body">Original inputs,</text><text x="588" y="504" text-anchor="middle" class="body">outputs + actions</text>
  <text x="1128" y="414" text-anchor="middle" class="label">Complete raw image</text><path d="M948 430H1308" class="arrow" stroke="#3275C6" marker-end="url(#blue-arrow)"/>
  <text x="1494" y="466" text-anchor="middle" class="label">Commit raw inputs</text><path d="M1308 482H1680" class="arrow" stroke="#3275C6" marker-end="url(#blue-arrow)"/>
  <text x="1494" y="518" text-anchor="middle" class="label">Applied epoch/seq + outputs</text><path d="M1680 534H1308" class="arrow" stroke="#138B83" marker-end="url(#teal-arrow)"/>
  <text x="768" y="558" text-anchor="middle" class="label" style="fill:#B7791F">Evidence stream</text><path d="M948 574H588" class="arrow" stroke="#B7791F" marker-end="url(#amber-arrow)"/>
  <text x="1128" y="570" text-anchor="middle" class="label">Feedback → next image</text><path d="M1308 586H948" class="arrow" stroke="#138B83" marker-end="url(#teal-arrow)"/>

  <!-- This overlay is the actual model-authored campaign, not a prescribed runtime sequence. -->
  <text x="64" y="659" class="section" style="fill:#138B83">PROVEN LIVE · MUSE-CHOSEN INVESTIGATION</text>
  <text x="1856" y="659" text-anchor="end" class="small">New test chosen after returned evidence</text>

  <rect x="64" y="686" width="280" height="250" rx="15" fill="#FFFFFF" stroke="#DACCF3" stroke-width="2"/>
  <circle cx="96" cy="718" r="17" fill="#7754D9"/><text x="96" y="724" text-anchor="middle" class="tag" style="fill:#FFFFFF">1</text>
  <text x="88" y="767" class="card-title">Choose a fault</text><text x="88" y="808" class="card-copy">Drive feedback</text><text x="88" y="839" class="card-copy">fails in the</text><text x="88" y="870" class="card-copy">generated world</text><text x="88" y="912" class="tag" style="fill:#7754D9">MUSE DECISION</text>

  <rect x="368" y="686" width="280" height="250" rx="15" fill="#FFFFFF" stroke="#BFDCD7" stroke-width="2"/>
  <circle cx="400" cy="718" r="17" fill="#138B83"/><text x="400" y="724" text-anchor="middle" class="tag" style="fill:#FFFFFF">2</text>
  <text x="392" y="767" class="card-title">Read real response</text><text x="392" y="808" class="card-copy">PLC fault <tspan font-weight="750" fill="#138B83">12</tspan></text><text x="392" y="839" class="card-copy">Motor command</text><text x="392" y="870" class="card-copy">off</text><text x="392" y="912" class="tag" style="fill:#138B83">PLC OBSERVATION</text>

  <rect x="672" y="686" width="280" height="250" rx="15" fill="#FFFFFF" stroke="#CADCF2" stroke-width="2"/>
  <circle cx="704" cy="718" r="17" fill="#3275C6"/><text x="704" y="724" text-anchor="middle" class="tag" style="fill:#FFFFFF">3</text>
  <text x="696" y="767" class="card-title">Test recovery</text><text x="696" y="808" class="card-copy">Clear + Reset</text><text x="696" y="839" class="card-copy">Stopped;</text><text x="696" y="870" class="card-copy">no auto-restart</text><text x="696" y="912" class="tag" style="fill:#3275C6">OBSERVED RECOVERY</text>

  <rect x="976" y="686" width="280" height="250" rx="15" fill="#F5F1FD" stroke="#7754D9" stroke-width="2"/>
  <circle cx="1008" cy="718" r="17" fill="#7754D9"/><text x="1008" y="724" text-anchor="middle" class="tag" style="fill:#FFFFFF">4</text>
  <text x="1000" y="767" class="card-title">Choose NEW test</text><text x="1000" y="808" class="card-copy">From that evidence:</text><text x="1000" y="839" class="card-copy">contradictory</text><text x="1000" y="870" class="card-copy">D1 limit feedback</text><text x="1000" y="912" class="tag" style="fill:#7754D9">ADAPTIVE FOLLOW-UP</text>

  <rect x="1280" y="686" width="280" height="250" rx="15" fill="#FFFFFF" stroke="#BFDCD7" stroke-width="2"/>
  <circle cx="1312" cy="718" r="17" fill="#138B83"/><text x="1312" y="724" text-anchor="middle" class="tag" style="fill:#FFFFFF">5</text>
  <text x="1304" y="767" class="card-title">Read real response</text><text x="1304" y="808" class="card-copy">PLC fault <tspan font-weight="750" fill="#138B83">21</tspan></text><text x="1304" y="839" class="card-copy">Motor + D1</text><text x="1304" y="870" class="card-copy">commands off</text><text x="1304" y="912" class="tag" style="fill:#138B83">DISTINCT PLC FAULT</text>

  <rect x="1584" y="686" width="272" height="250" rx="15" fill="#FFFBF2" stroke="#E2C58F" stroke-width="2"/>
  <circle cx="1616" cy="718" r="17" fill="#B7791F"/><text x="1616" y="724" text-anchor="middle" class="tag" style="fill:#FFFFFF">6</text>
  <text x="1608" y="767" class="card-title">Recover + report</text><text x="1608" y="808" class="card-copy">Clear + Reset</text><text x="1608" y="839" class="card-copy">2 findings</text><text x="1608" y="870" class="card-copy">31 verified claims</text><text x="1608" y="912" class="tag" style="fill:#B7791F">AUDITABLE EVIDENCE</text>
  <g class="arrow" stroke="#9AA9BB" marker-end="url(#grey-arrow)"><path d="M348 811H362"/><path d="M652 811H666"/><path d="M956 811H970"/><path d="M1260 811H1274"/><path d="M1564 811H1578"/></g>

  <path d="M64 965H1856" stroke="#E1E7EE" stroke-width="2"/>
  <text x="64" y="997" class="small">Timing: hold freezes world evolution, not PLC scan/timers. Continue and condition/deadline policies are bounded.</text>
  <text x="64" y="1028" class="small">10 Hz is the qualified transport point; the PLC runs its own scan. Earlier normal A-sort proof is separate.</text>
  <text x="64" y="1059" class="small">Muse HMI operation: separate live proof passed with limits; stale/disconnect untested. This diagram shows the fault/adaptive campaign.</text>
</svg>
