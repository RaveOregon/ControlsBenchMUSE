<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc"><title id="title">Agnostic investigation loop with populated demo adapters</title><desc id="desc">Five generic roles show model, coordinator, world runtime, connection adapter and controller platform. Demo selections are secondary labels. A neutral six-step adaptive testing pattern is separate from the specific conveyor fault evidence in a bottom example strip.</desc><defs><style>text{font-family:"Segoe UI",Arial,sans-serif}</style><marker id="a3275C6" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 8 4 0 8Z" fill="#3275C6"/></marker><marker id="a138B83" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 8 4 0 8Z" fill="#138B83"/></marker><marker id="a7754D9" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 8 4 0 8Z" fill="#7754D9"/></marker><marker id="aB7791F" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 8 4 0 8Z" fill="#B7791F"/></marker></defs><rect width="1920" height="1080" fill="white"/><text x="56" y="68" font-size="44" fill="#132238" font-weight="700" text-anchor="start">How a ControlsBench investigation runs</text><text x="56" y="110" font-size="24" fill="#526176" font-weight="400" text-anchor="start">The execution pattern stays the same when the connector or controller platform changes.</text><rect x="56" y="158" width="326" height="132" rx="16" fill="#F7F9FC" stroke="#D5DFEA" stroke-width="2"/><text x="219" y="196" font-size="24" fill="#7754D9" font-weight="700" text-anchor="middle">AI model adapter</text><rect x="69" y="214" width="300" height="54" rx="9" fill="#F3F7FB" stroke="#D5DFEA" stroke-width="2"/><text x="81" y="233" font-size="12" fill="#7754D9" font-weight="700" text-anchor="start">DEMO SELECTION</text><text x="81" y="255" font-size="19" fill="#132238" font-weight="600" text-anchor="start">Muse Wonder · Meta API</text><path d="M219 290V600" stroke="#D7E1ED" stroke-width="2" stroke-dasharray="5 8"/><rect x="426" y="158" width="326" height="132" rx="16" fill="#F7F9FC" stroke="#D5DFEA" stroke-width="2"/><text x="589" y="196" font-size="24" fill="#3275C6" font-weight="700" text-anchor="middle">Campaign coordinator</text><text x="589" y="243" font-size="18" fill="#526176" font-weight="400" text-anchor="middle">Plans · tools · evidence</text><path d="M589 290V600" stroke="#D7E1ED" stroke-width="2" stroke-dasharray="5 8"/><rect x="796" y="158" width="326" height="132" rx="16" fill="#F7F9FC" stroke="#D5DFEA" stroke-width="2"/><text x="959" y="196" font-size="24" fill="#138B83" font-weight="700" text-anchor="middle">World runtime</text><text x="959" y="243" font-size="18" fill="#526176" font-weight="400" text-anchor="middle">Generated behavior · raw signals</text><path d="M959 290V600" stroke="#D7E1ED" stroke-width="2" stroke-dasharray="5 8"/><rect x="1166" y="158" width="326" height="132" rx="16" fill="#F7F9FC" stroke="#D5DFEA" stroke-width="2"/><text x="1329" y="196" font-size="24" fill="#3275C6" font-weight="700" text-anchor="middle">Connection adapter</text><rect x="1179" y="214" width="300" height="54" rx="9" fill="#F3F7FB" stroke="#D5DFEA" stroke-width="2"/><text x="1191" y="233" font-size="12" fill="#3275C6" font-weight="700" text-anchor="start">DEMO SELECTION</text><text x="1191" y="255" font-size="19" fill="#132238" font-weight="600" text-anchor="start">OPC UA · 10 Hz demo</text><path d="M1329 290V600" stroke="#D7E1ED" stroke-width="2" stroke-dasharray="5 8"/><rect x="1536" y="158" width="326" height="132" rx="16" fill="#F7F9FC" stroke="#D5DFEA" stroke-width="2"/><text x="1699" y="196" font-size="24" fill="#138B83" font-weight="700" text-anchor="middle">Controller platform</text><rect x="1549" y="214" width="300" height="54" rx="9" fill="#F3F7FB" stroke="#D5DFEA" stroke-width="2"/><text x="1561" y="233" font-size="12" fill="#138B83" font-weight="700" text-anchor="start">DEMO SELECTION</text><text x="1561" y="255" font-size="19" fill="#132238" font-weight="600" text-anchor="start">CODESYS Control Win</text><path d="M1699 290V600" stroke="#D7E1ED" stroke-width="2" stroke-dasharray="5 8"/><path d="M219 323H959" fill="none" stroke="#7754D9" stroke-width="3" stroke-linejoin="round" marker-end="url(#a7754D9)"/><text x="590" y="312" font-size="21" fill="#7754D9" font-weight="600" text-anchor="middle">Author / validate the world and choose an experiment</text><rect x="56" y="355" width="1808" height="265" rx="16" fill="#F5F8FC" stroke="#D5DFEA" stroke-width="2"/><text x="80" y="389" font-size="17" fill="#3275C6" font-weight="700" text-anchor="start">CONTINUOUS EXECUTION THROUGH THE SELECTED ADAPTER</text><rect x="80" y="419" width="316" height="147" rx="12" fill="#F4F0FC" stroke="#D5C7F0" stroke-width="2"/><text x="103" y="456" font-size="22" fill="#7754D9" font-weight="650" text-anchor="start">Asynchronous model turns</text><text x="103" y="492" font-size="20" fill="#526176" font-weight="400" text-anchor="start">Observes returned evidence</text><text x="103" y="528" font-size="19" fill="#526176" font-weight="400" text-anchor="start">Chooses the next intervention</text><path d="M959 432H1329" fill="none" stroke="#3275C6" stroke-width="3" stroke-linejoin="round" marker-end="url(#a3275C6)"/><text x="1144" y="422" font-size="20" fill="#3275C6" font-weight="600" text-anchor="middle">Raw image / service request</text><path d="M1329 477H1699" fill="none" stroke="#3275C6" stroke-width="3" stroke-linejoin="round" marker-end="url(#a3275C6)"/><text x="1514" y="466" font-size="20" fill="#3275C6" font-weight="600" text-anchor="middle">Platform-native exchange</text><path d="M1699 524H1329" fill="none" stroke="#138B83" stroke-width="3" stroke-linejoin="round" marker-end="url(#a138B83)"/><text x="1514" y="513" font-size="18" fill="#138B83" font-weight="600" text-anchor="middle">Actual response + applied acknowledgement</text><path d="M1329 573H959" fill="none" stroke="#138B83" stroke-width="3" stroke-linejoin="round" marker-end="url(#a138B83)"/><text x="1144" y="562" font-size="20" fill="#138B83" font-weight="600" text-anchor="middle">Evolve the next world state</text><path d="M959 588H589" fill="none" stroke="#B7791F" stroke-width="3" stroke-linejoin="round" marker-end="url(#aB7791F)"/><text x="774" y="577" font-size="19" fill="#B7791F" font-weight="600" text-anchor="middle">Preserve original observations</text><text x="56" y="672" font-size="18" fill="#7754D9" font-weight="700" text-anchor="start">ADAPTIVE CAMPAIGN PATTERN</text><rect x="56" y="700" width="273" height="205" rx="16" fill="#FFF" stroke="#D5DFEA" stroke-width="2"/><circle cx="86" cy="731" r="17" fill="#138B83"/><text x="86" y="737" font-size="19" fill="#FFF" font-weight="700" text-anchor="middle">1</text><text x="76" y="784" font-size="24" fill="#132238" font-weight="700" text-anchor="start">Choose test</text><text x="76" y="824" font-size="20" fill="#526176" font-weight="400" text-anchor="start">Specification + scope</text><text x="76" y="858" font-size="20" fill="#526176" font-weight="400" text-anchor="start">Expected observations</text><path d="M329 803H360" fill="none" stroke="#3275C6" stroke-width="3" stroke-linejoin="round" marker-end="url(#a3275C6)"/><rect x="363" y="700" width="273" height="205" rx="16" fill="#FFF" stroke="#D5DFEA" stroke-width="2"/><circle cx="393" cy="731" r="17" fill="#138B83"/><text x="393" y="737" font-size="19" fill="#FFF" font-weight="700" text-anchor="middle">2</text><text x="383" y="784" font-size="24" fill="#132238" font-weight="700" text-anchor="start">Apply stimulus</text><text x="383" y="824" font-size="20" fill="#526176" font-weight="400" text-anchor="start">Raw inputs / services</text><text x="383" y="858" font-size="20" fill="#526176" font-weight="400" text-anchor="start">or operator actions</text><path d="M636 803H667" fill="none" stroke="#3275C6" stroke-width="3" stroke-linejoin="round" marker-end="url(#a3275C6)"/><rect x="670" y="700" width="273" height="205" rx="16" fill="#FFF" stroke="#D5DFEA" stroke-width="2"/><circle cx="700" cy="731" r="17" fill="#138B83"/><text x="700" y="737" font-size="19" fill="#FFF" font-weight="700" text-anchor="middle">3</text><text x="690" y="784" font-size="24" fill="#132238" font-weight="700" text-anchor="start">Observe response</text><text x="690" y="824" font-size="20" fill="#526176" font-weight="400" text-anchor="start">Controller state</text><text x="690" y="858" font-size="20" fill="#526176" font-weight="400" text-anchor="start">and HMI evidence</text><path d="M943 803H974" fill="none" stroke="#3275C6" stroke-width="3" stroke-linejoin="round" marker-end="url(#a3275C6)"/><rect x="977" y="700" width="273" height="205" rx="16" fill="#F4F0FC" stroke="#7754D9" stroke-width="2"/><circle cx="1007" cy="731" r="17" fill="#7754D9"/><text x="1007" y="737" font-size="19" fill="#FFF" font-weight="700" text-anchor="middle">4</text><text x="997" y="784" font-size="24" fill="#132238" font-weight="700" text-anchor="start">Adapt the plan</text><text x="997" y="824" font-size="20" fill="#526176" font-weight="400" text-anchor="start">New hypothesis</text><text x="997" y="858" font-size="20" fill="#526176" font-weight="400" text-anchor="start">from returned evidence</text><path d="M1250 803H1281" fill="none" stroke="#3275C6" stroke-width="3" stroke-linejoin="round" marker-end="url(#a3275C6)"/><rect x="1284" y="700" width="273" height="205" rx="16" fill="#FFF" stroke="#D5DFEA" stroke-width="2"/><circle cx="1314" cy="731" r="17" fill="#138B83"/><text x="1314" y="737" font-size="19" fill="#FFF" font-weight="700" text-anchor="middle">5</text><text x="1304" y="784" font-size="24" fill="#132238" font-weight="700" text-anchor="start">Check outcome</text><text x="1304" y="824" font-size="20" fill="#526176" font-weight="400" text-anchor="start">Expected vs observed</text><text x="1304" y="858" font-size="20" fill="#526176" font-weight="400" text-anchor="start">Gaps and uncertainty</text><path d="M1557 803H1588" fill="none" stroke="#3275C6" stroke-width="3" stroke-linejoin="round" marker-end="url(#a3275C6)"/><rect x="1591" y="700" width="273" height="205" rx="16" fill="#FFF" stroke="#D5DFEA" stroke-width="2"/><circle cx="1621" cy="731" r="17" fill="#138B83"/><text x="1621" y="737" font-size="19" fill="#FFF" font-weight="700" text-anchor="middle">6</text><text x="1611" y="784" font-size="24" fill="#132238" font-weight="700" text-anchor="start">Report results</text><text x="1611" y="824" font-size="20" fill="#526176" font-weight="400" text-anchor="start">Findings + references</text><text x="1611" y="858" font-size="20" fill="#526176" font-weight="400" text-anchor="start">Reviewable evidence</text><rect x="56" y="938" width="1808" height="82" rx="12" fill="#F8FAFC" stroke="#D5DFEA" stroke-width="2"/><text x="80" y="967" font-size="15" fill="#3275C6" font-weight="700" text-anchor="start">DEMO EVIDENCE — A POPULATED INSTANCE OF THIS PATTERN</text><text x="80" y="1000" font-size="22" fill="#132238" font-weight="400" text-anchor="start">Drive-feedback fault 12 → recovery → Muse-selected D1 feedback test → fault 21 → findings and report</text><text x="56" y="1054" font-size="18" fill="#526176" font-weight="400" text-anchor="start">Controller scan / timers remain independent of model turns and transport cadence. Other adapters require their own timing qualification.</text></svg>
