<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc"><title id="title">ControlsBench Muse — agnostic product architecture</title><desc id="desc">Generic model, connection and PLC platform adapters surround the ControlsBench app, campaign coordinator and world runtime. Current demo selections populate those slots: Muse Wonder via Meta API, OPC UA, CODESYS Control Win and M8 demo FB. The actual operator interface is distinct from the generated machine view.</desc><defs><style>text{font-family:"Segoe UI",Arial,sans-serif}</style><marker id="a3275C6" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 8 4 0 8Z" fill="#3275C6"/></marker><marker id="a138B83" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 8 4 0 8Z" fill="#138B83"/></marker><marker id="a7754D9" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 8 4 0 8Z" fill="#7754D9"/></marker><marker id="aB7791F" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 8 4 0 8Z" fill="#B7791F"/></marker></defs><rect width="1920" height="1080" fill="white"/><text x="56" y="68" font-size="44" fill="#132238" font-weight="700" text-anchor="start">ControlsBench Muse — product architecture</text><text x="56" y="110" font-size="24" fill="#526176" font-weight="400" text-anchor="start">Agnostic connector and platform interfaces, populated with the current demo choices.</text><rect x="56" y="155" width="330" height="190" rx="16" fill="#F7F9FC" stroke="#D5DFEA" stroke-width="2"/><text x="80" y="192" font-size="17" fill="#526176" font-weight="700" text-anchor="start">ENGINEER INPUT</text><text x="80" y="235" font-size="26" fill="#132238" font-weight="650" text-anchor="start">Machine specification</text><text x="80" y="273" font-size="22" fill="#132238" font-weight="400" text-anchor="start">Raw I/O + service contracts</text><text x="80" y="315" font-size="18" fill="#526176" font-weight="400" text-anchor="start">Equipment, behavior and expectations</text><rect x="420" y="155" width="990" height="760" rx="16" fill="#F5F8FC" stroke="#D5DFEA" stroke-width="2"/><text x="450" y="190" font-size="17" fill="#3275C6" font-weight="700" text-anchor="start">ENGINEER WORKSTATION</text><rect x="450" y="210" width="930" height="180" rx="16" fill="#FFF" stroke="#D5DFEA" stroke-width="2"/><text x="475" y="250" font-size="29" fill="#132238" font-weight="700" text-anchor="start">ControlsBench app</text><text x="475" y="281" font-size="21" fill="#526176" font-weight="400" text-anchor="start">Project · Review · Campaign · Evidence · Report</text><rect x="475" y="300" width="430" height="67" rx="10" fill="#EDF4FD" stroke="#EDF4FD" stroke-width="2"/><text x="495" y="328" font-size="23" fill="#132238" font-weight="650" text-anchor="start">Generated machine view</text><text x="495" y="353" font-size="18" fill="#526176" font-weight="400" text-anchor="start">Bound to world / controller state</text><rect x="925" y="300" width="430" height="67" rx="10" fill="#EDF7F5" stroke="#EDF7F5" stroke-width="2"/><text x="945" y="328" font-size="23" fill="#132238" font-weight="650" text-anchor="start">Actual operator interface</text><text x="945" y="353" font-size="18" fill="#526176" font-weight="400" text-anchor="start">Capture / action adapter + evidence</text><rect x="56" y="405" width="330" height="335" rx="16" fill="#F4F0FC" stroke="#D5C7F0" stroke-width="2"/><text x="80" y="445" font-size="27" fill="#7754D9" font-weight="700" text-anchor="start">AI model adapter</text><text x="80" y="488" font-size="21" fill="#132238" font-weight="400" text-anchor="start">Authors the reactive world</text><text x="80" y="524" font-size="21" fill="#132238" font-weight="400" text-anchor="start">Plans and investigates</text><text x="80" y="560" 