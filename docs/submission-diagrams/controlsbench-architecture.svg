<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description">
  <title id="title">ControlsBench Muse — from specification to evidence</title>
  <desc id="description">An engineer provides a specification and I/O map. Muse Wonder plans and investigates through a workstation campaign runtime. An isolated generated world exchanges raw inputs and authentic outputs with actual CODESYS logic through OPC UA and a demo interceptor. The app separates a generated machine view from actual HMI pixels. HMI agent operation awaits live proof.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 8 4 0 8Z" fill="#3275C6"/></marker>
    <marker id="arrow-teal" markerWidth="11" markerHeight="11" refX="9" refY="4.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 9 4.5 0 9Z" fill="#138B83"/></marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 8 4 0 8Z" fill="#7754D9"/></marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 8 4 0 8Z" fill="#B7791F"/></marker>
    <style>
      text{font-family:Inter,"Segoe UI",Arial,sans-serif;fill:#132238}
      .heading{font-size:44px;font-weight:700;letter-spacing:-1px}.subtitle{font-size:25px;fill:#526176}
      .eyebrow{font-size:18px;font-weight:700;letter-spacing:2px}.box-title{font-size:25px;font-weight:650;letter-spacing:-.3px}
      .detail{font-size:20px;fill:#526176}.small{font-size:18px;fill:#526176}.label{font-size:19px;font-weight:600}
      .boundary{fill:#F5F8FC;stroke:#CFD9E7;stroke-width:1.5}.card{fill:#FFF;stroke:#B7CCE8;stroke-width:2}
      .blue{stroke:#3275C6;fill:none;stroke-width:3;stroke-linejoin:round}.teal{stroke:#138B83;fill:none;stroke-width:3;stroke-linejoin:round}
      .purple{stroke:#7754D9;fill:none;stroke-width:2.5;stroke-dasharray:8 7;stroke-linejoin:round}.amber{stroke:#B7791F;fill:none;stroke-width:2.5}
    </style>
  </defs>
  <rect width="1920" height="1080" fill="#FFFFFF"/>
  <text x="56" y="68" class="heading">ControlsBench Muse</text>
  <text x="56" y="111" class="subtitle">From a machine specification to a live PLC investigation and an evidence-backed report.</text>
  <g transform="translate(1538 39)">
    <rect width="326" height="48" rx="24" fill="#E6F4F1"/>
    <circle cx="25" cy="24" r="5" fill="#138B83"/>
    <text x="43" y="31" font-size="20" font-weight="650" fill="#138B83">Core loop proven live</text>
  </g>

  <!-- Clear deployment boundaries: input, API model, workstation and PLC. -->
  <rect x="56" y="180" width="330" height="181" rx="18" fill="#F7F8FB" stroke="#CFD9E7" stroke-width="1.5"/>
  <text x="80" y="218" class="eyebrow" fill="#526176">ENGINEER INPUT</text>
  <text x="80" y="264" class="box-title">Functional specification</text>
  <text x="80" y="300" class="box-title">+ typed I/O information</text>
  <text x="80" y="336" class="detail">The machine and its raw signals</text>

  <rect x="56" y="430" width="330" height="370" rx="22" fill="#F4F0FC" stroke="#D4C7EF" stroke-width="1.5"/>
  <text x="80" y="469" class="eyebrow" fill="#7754D9">META API</text>
  <rect x="80" y="535" width="280" height="180" rx="16" fill="#FFFFFF" stroke="#7754D9" stroke-width="2"/>
  <text x="104" y="579" class="box-title" fill="#7754D9">Muse Wonder 1.0</text>
  <text x="104" y="621" class="detail">Authors the reactive world</text>
  <text x="104" y="654" class="detail">Plans and investigates</text>
  <text x="104" y="687" class="detail">Reasons between actions</text>
  <text x="80" y="758" class="small">Model requests are asynchronous.</text>

  <rect x="420" y="180" width="976" height="770" rx="22" class="boundary"/>
  <text x="452" y="216" class="eyebrow" fill="#3275C6">ENGINEER WORKSTATION</text>
  <rect x="452" y="238" width="912" height="222" rx="16" class="card"/>
  <text x="478" y="277" class="box-title">ControlsBench app</text>
  <text x="478" y="309" class="detail">Plan · Progress · Evidence · Report</text>
  <rect x="478" y="330" width="408" height="102" rx="11" fill="#F1F6FD"/>
  <rect x="926" y="330" width="412" height="102" rx="11" fill="#F1F7F6"/>
  <text x="499" y="366" font-size="24" font-weight="650">Generated machine view</text>
  <text x="499" y="398" font-size="19" fill="#526176">Spec-derived · world / PLC state</text>
  <text x="947" y="366" font-size="24" font-weight="650">Actual HMI session</text>
  <text x="947" y="398" font-size="19" fill="#526176">Local Node service · browser pixels</text>

  <rect x="1424" y="180" width="440" height="770" rx="22" fill="#F1F8F6" stroke="#B6D9D3" stroke-width="1.5"/>
  <text x="1456" y="218" class="eyebrow" fill="#138B83">PLC TARGET</text>
  <text x="1456" y="268" font-size="30" font-weight="700">CODESYS Control Win</text>
  <text x="1456" y="307" font-size="24" fill="#526176">Actual application logic</text>

  <!-- App source and the distinct supervisory HMI connection. -->
  <path d="M386 282H452" class="blue" marker-end="url(#arrow-blue)"/>
  <path d="M1338 380H1810V550" class="teal" marker-start="url(#arrow-teal)" marker-end="url(#arrow-teal)"/>
  <rect x="1450" y="407" width="350" height="62" rx="10" fill="#F1F8F6"/>
  <text x="1467" y="429" class="label" fill="#138B83">HMI supervisory connection</text>
  <text x="1467" y="457" class="small">PLC status + operator commands</text>

  <!-- The dashed lane is implemented but not represented as proven live. -->
  <path d="M360 554H398V483H1127V432" class="purple" marker-end="url(#arrow-purple)"/>
  <rect x="601" y="470" width="483" height="28" rx="7" fill="#F5F8FC"/>
  <text x="617" y="490" font-size="18" font-weight="600" fill="#7754D9">Muse HMI actions · live-proven operator slice</text>

  <!-- App passes the imported spec/scope into the runtime. The underlay makes
       the crossing over the independent dashed HMI lane unambiguous. -->
  <path d="M500 460V500H436V575H452" fill="none" stroke="#F5F8FC" stroke-width="9" stroke-linejoin="round"/>
  <path d="M500 460V500H436V575H452" class="blue" marker-end="url(#arrow-blue)"/>

  <text x="452" y="527" class="eyebrow" fill="#3275C6">ACTIVE INVESTIGATION</text>
  <text x="800" y="527" class="eyebrow" fill="#138B83">CONTINUOUS CLOSED LOOP</text>

  <!-- Runtime intelligence and continuous world execution remain separate. -->
  <rect x="452" y="550" width="295" height="150" rx="15" class="card"/>
  <text x="476" y="590" class="box-title">Campaign runtime</text>
  <text x="476" y="631" class="detail">Spec + signal contract</text>
  <text x="476" y="664" class="detail">Tools + decision leases</text>
  <rect x="800" y="550" width="295" height="150" rx="15" fill="#FFFFFF" stroke="#138B83" stroke-width="2"/>
  <text x="824" y="583" class="box-title">Generated world</text>
  <text x="824" y="608" font-size="17" fill="#526176">Isolated child process</text>
  <text x="824" y="639" class="detail">Physics · sensors · faults</text>
  <text x="824" y="671" class="detail">Raw I/O + encoder counts</text>
  <rect x="1148" y="550" width="216" height="150" rx="15" class="card"/>
  <text x="1172" y="591" class="box-title">OPC UA</text>
  <text x="1172" y="632" class="detail">10 Hz demo qualified</text>
  <text x="1172" y="665" class="detail">Signal boundary</text>
  <rect x="1456" y="550" width="176" height="150" rx="15" fill="#FFFFFF" stroke="#138B83" stroke-width="2"/>
  <text x="1477" y="585" font-size="24" font-weight="650">Demo</text>
  <text x="1477" y="618" font-size="20" font-weight="650">interceptor FB</text>
  <text x="1477" y="661" font-size="18" fill="#526176">Raw input selection</text>
  <rect x="1672" y="550" width="160" height="150" rx="15" fill="#FFFFFF" stroke="#138B83" stroke-width="2"/>
  <text x="1692" y="586" font-size="25" font-weight="650">PLC</text>
  <text x="1692" y="619" font-size="25" font-weight="650">application</text>
  <text x="1692" y="663" font-size="18" fill="#526176">Scaling + logic</text>

  <path d="M360 610H452" stroke="#7754D9" fill="none" stroke-width="3" marker-end="url(#arrow-purple)"/>
  <text x="406" y="596" font-size="17" font-weight="600" text-anchor="middle" fill="#7754D9">decisions</text>
  <path d="M452 670H360" stroke="#7754D9" fill="none" stroke-width="3" marker-end="url(#arrow-purple)"/>
  <text x="406" y="696" font-size="17" font-weight="600" text-anchor="middle" fill="#7754D9">evidence</text>
  <path d="M747 625H800" class="blue" marker-end="url(#arrow-blue)"/>
  <path d="M1095 625H1148" class="teal" marker-end="url(#arrow-teal)"/>
  <path d="M1364 625H1456" class="teal" marker-end="url(#arrow-teal)"/>
  <text x="1410" y="610" font-size="17" font-weight="600" text-anchor="middle" fill="#138B83">raw inputs</text>
  <path d="M1632 625H1672" class="teal" marker-end="url(#arrow-teal)"/>

  <!-- Authentic outputs return through the same connector to evolve the world. -->
  <rect x="1456" y="770" width="376" height="100" rx="15" fill="#FFFFFF" stroke="#138B83" stroke-width="2"/>
  <text x="1480" y="810" class="box-title">Authentic output capture</text>
  <text x="1480" y="846" class="detail">Commands · status · applied ack</text>
  <path d="M1752 700V770" class="teal" marker-end="url(#arrow-teal)"/>
  <path d="M1456 820H1398V744H1320V700" class="teal" marker-end="url(#arrow-teal)"/>
  <path d="M1210 700V775H947V700" class="teal" marker-end="url(#arrow-teal)"/>
  <text x="1075" y="809" font-size="19" font-weight="600" text-anchor="middle" fill="#138B83">PLC outputs / status + applied-image acknowledgement</text>
  <text x="1456" y="909" class="small">PLC scan and timers run independently.</text>
  <text x="1456" y="935" class="small">Editable / rebuildable project required.</text>

  <path d="M600 700V850" class="amber" marker-end="url(#arrow-amber)"/>
  <text x="622" y="764" font-size="18" fill="#B7791F">Timestamped,</text>
  <text x="622" y="791" font-size="18" fill="#B7791F">hash-linked trace</text>
  <rect x="452" y="850" width="912" height="75" rx="14" fill="#FFF9EC" stroke="#D8B776" stroke-width="1.5"/>
  <text x="476" y="895" font-size="25" font-weight="650" fill="#B7791F">Evidence + report</text>
  <text x="755" y="881" font-size="19" fill="#526176">Physical truth · raw images · PLC observations</text>
  <text x="755" y="908" font-size="19" fill="#526176">HMI pixels/actions · model interpretation</text>

  <line x1="56" y1="986" x2="1864" y2="986" stroke="#DDE4ED" stroke-width="1.5"/>
  <text x="56" y="1023" font-size="22" font-weight="600">Muse authors the world and investigations. ControlsBench executes and preserves the evidence.</text>
  <text x="56" y="1056" font-size="19" fill="#526176">Next steps: deploy the compiled reusable library prototype; add other vendor adapters. These are separate from the proven demo.</text>
</svg>
