" r="6" fill="#138B83"/><circle cx="576" cy="436" r="5" fill="#C3C9D2"/><circle cx="576" cy="558" r="5" fill="#C3C9D2"/><circle cx="576" cy="680" r="5" fill="#C3C9D2"/><circle cx="576" cy="802" r="5" fill="#C3C9D2"/><path d="M1220 465H1270" stroke="#3275C6" stroke-width="3" fill="none"/><path d="M1270 465V314H1344" stroke="#3275C6" stroke-width="3" fill="none"/><path d="M1270 465V802" stroke="#C3C9D2" stroke-width="2" stroke-dasharray="6 6" fill="none"/><path d="M1270 436H1344" stroke="#C3C9D2" stroke-width="2" stroke-dasharray="6 6" fill="none"/><path d="M1270 558H1344" stroke="#C3C9D2" stroke-width="2" stroke-dasharray="6 6" fill="none"/><path d="M1270 680H1344" stroke="#C3C9D2" stroke-width="2" stroke-dasharray="6 6" fill="none"/><path d="M1270 802H1344" stroke="#C3C9D2" stroke-width="2" stroke-dasharray="6 6" fill="none"/><circle cx="1344" cy="314" r="6" fill="#3275C6"/><circle cx="1344" cy="436" r="5" fill="#C3C9D2"/><circle cx="1344" cy="558" r="5" fill="#C3C9D2"/><circle cx="1344" cy="680" r="5" fill="#C3C9D2"/><circle cx="1344" cy="802" r="5" fill="#C3C9D2"/><rect x="730" y="150" width="460" height="92" rx="16" fill="#F7F3FF" stroke="#7754D9" stroke-width="2"/><text x="960" y="188" font-size="24" fill="#132238" font-weight="650" text-anchor="middle">Machine specification + I/O list</text><text x="960" y="221" font-size="19" fill="#526176" font-weight="400" text-anchor="middle">Muse prepares the world, mapping and test plan</text><path d="M960 242V292" stroke="#7754D9" stroke-width="3" marker-end="url(#ap)"/><rect x="700" y="300" width="520" height="332" rx="20" fill="#F2F7FD" stroke="#3275C6" stroke-width="2.5"/><text x="960" y="340" font-size="15" fill="#3275C6" font-weight="700" text-anchor="middle" letter-spacing="2">SPEC-DRIVEN CORE</text><text x="960" y="380" font-size="32" fill="#132238" font-weight="700" text-anchor="middle">ControlsBench PLC Library</text><text x="960" y="412" font-size="21" fill="#526176" font-weight="400" text-anchor="middle">Versioned signal contract</text><rect x="736" y="434" width="448" height="40" rx="10" fill="#FFFFFF" stroke="#C7D7EE" stroke-width="1.5"/><text x="960" y="460" font-size="17" fill="#2B3A4F" font-weight="400" text-anchor="middle">Typed raw I/O · direction · roles · normal values</text><rect x="736" y="482" width="448" height="40" rx="10" fill="#FFFFFF" stroke="#C7D7EE" stroke-width="1.5"/><text x="960" y="508" font-size="17" fill="#2B3A4F" font-weight="400" text-anchor="middle">Simulated input image + output observation</text><rect x="736" y="530" width="448" height="40" rx="10" fill="#FFFFFF" stroke="#C7D7EE" stroke-width="1.5"/><text x="960" y="556" font-size="17" fill="#2B3A4F" font-weight="400" text-anchor="middle">Applied-image acknowledgement + freshness</text><rect x="736" y="578" width="448" height="40" rx="10" fill="#FFFFFF" stroke="#C7D7EE" stroke-width="1.5"/><text x="960" y="604" font-size="17" fill="#2B3A4F" font-weight="400" text-anchor="middle">Link loss: hold last image + bench diagnostic</text><path d="M960 632V690" stroke="#E3C27A" stroke-width="2" stroke-dasharray="6 6"/><rect x="700" y="690" width="520" height="164" rx="16" fill="#FFFBF2" stroke="#E3C27A" stroke-width="2"/><text x="960" y="728" font-size="15" fill="#B7791F" font-weight="700" text-anchor="middle" letter-spacing="1.5">ADD A TARGET = ADD ONE ADAPTER</text><text x="960" y="766" font-size="22" fill="#132238" font-weight="600" text-anchor="middle">Campaigns, generated worlds, evidence</text><text x="960" y="796" font-size="22" fill="#132238" font-weight="600" text-anchor="middle">and reports stay the same</text><text x="960" y="832" font-size="18" fill="#526176" font-weight="400" text-anchor="middle">Specification → contract → adapter → protocol profile</text><rect x="48" y="944" width="40" height="26" rx="8" fill="#138B83"/><rect x="92" y="944" width="40" height="26" rx="8" fill="#3275C6"/><text x="146" y="964" font-size="19" fill="#132238" font-weight="600" text-anchor="start">In use</text><text x="212" y="964" font-size="19" fill="#526176" font-weight="400" text-anchor="start">— demonstrated on the live CODESYS + OPC UA bench</text><rect x="760" y="944" width="40" height="26" rx="8" fill="#F4F5F7" stroke="#C9CED6" stroke-width="2" stroke-dasharray="5 4"/><text x="814" y="964" font-size="19" fill="#132238" font-weight="600" text-anchor="start">Planned / coming soon</text><text x="1030" y="964" font-size="19" fill="#526176" font-weight="400" text-anchor="start">— roadmap; adapter not yet built or qualified</text><text x="48" y="1036" font-size="17" fill="#6B7280" font-weight="400" text-anchor="start">Greyed targets are roadmap items, not demonstrated integrations. Each needs its own adapter and bench qualification against the same contract.</text></svg>
