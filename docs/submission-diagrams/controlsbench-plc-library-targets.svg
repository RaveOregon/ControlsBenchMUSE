<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc"><title id="title">ControlsBench PLC Library: spec-driven, platform- and protocol-agnostic</title><desc id="desc">One versioned signal contract generated from the machine specification connects to platform-specific PLC adapters and selectable communication protocols. CODESYS and OPC UA are in use; Siemens TIA Portal, Rockwell Studio 5000, Beckhoff TwinCAT 3 and B&amp;R Automation Studio are planned; EtherCAT, EtherNet/IP, PROFINET and Modbus TCP are coming soon.</desc><defs><style>text{font-family:"Segoe UI",Arial,sans-serif}</style><marker id="ap" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 8 4 0 8Z" fill="#7754D9"/></marker></defs><rect width="1920" height="1080" fill="white"/><text x="56" y="68" font-size="44" fill="#132238" font-weight="700" text-anchor="start">ControlsBench PLC Library</text><text x="56" y="110" font-size="24" fill="#526176" font-weight="400" text-anchor="start">Spec-driven and platform-agnostic: one versioned signal contract, thin adapters per PLC platform and per protocol.</text><rect x="48" y="150" width="560" height="760" rx="20" fill="#F4FAF9" stroke="#A9D8D3" stroke-width="2"/><text x="80" y="200" font-size="28" fill="#138B83" font-weight="700" text-anchor="start">PLC platforms</text><text x="80" y="232" font-size="19" fill="#526176" font-weight="400" text-anchor="start">Platform-specific library / function-block adapter</text><rect x="80" y="262" width="496" height="104" rx="16" fill="#138B83"/><text x="106" y="308" font-size="27" fill="#FFFFFF" font-weight="700" text-anchor="start">CODESYS</text><text x="106" y="342" font-size="19" fill="#E8F4F2" font-weight="400" text-anchor="start">Control Win V3 · M8 conveyor bench</text><rect x="442" y="282" width="112" height="32" rx="16" fill="#FFFFFF"/><text x="498" y="304" font-size="15" fill="#138B83" 