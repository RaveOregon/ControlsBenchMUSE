<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Stoplight — Built on BrowserHmi</title>
<link rel="stylesheet" href="../browser-hmi.css">
<style>
  /* Page-specific styling. The lamps come from browser-hmi.css; we just
     scale them up and arrange them in a vertical housing. */
  :root {
    --bg-1: #0b1220;
    --bg-2: #131b2e;
    --panel: #1c2541;
    --panel-edge: #283762;
    --text: #e6edf3;
    --muted: #8b95a8;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: radial-gradient(circle at 30% 20%, var(--bg-2), var(--bg-1));
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
  }
  .scene { display: grid; grid-template-columns: auto 1fr; gap: 60px;
           align-items: center; padding: 40px; max-width: 1100px; }
  .stoplight { display: flex; flex-direction: column; align-items: center; }
  .housing {
    background: linear-gradient(145deg, #1a1a1a, #050505);
    border: 4px solid #2a2a2a;
    border-radius: 32px;
    padding: 28px 24px;
    display: flex; flex-direction: column; gap: 28px;
    box-shadow: 0 30px 60px rgba(0,0,0,0.5),
                inset 0 2px 4px rgba(255,255,255,0.05),
                inset 0 -3px 8px rgba(0,0,0,0.4);
  }
  .housing .hmi-lamp { width: 180px; height: 180px; }   /* override default */
  .pole {
    width: 32px; height: 160px;
    background: linear-gradient(to right, #1a1a1a, #3a3a3a, #1a1a1a);
    border-radius: 0 0 4px 4px; margin-top: -2px;
  }
  .base {
    width: 200px; height: 24px;
    background: linear-gradient(to bottom, #3a3a3a, #1a1a1a);
    border-radius: 50%; margin-top: -2px;
  }
  .panel {
    background: linear-gradient(160deg, var(--panel), var(--bg-2));
    border: 1px solid var(--panel-edge);
    border-radius: 18px;
    padding: 32px 36px; min-width: 360px;
    box-shadow: 0 25px 60px rgba(0,0,0,0.5);
  }
  .panel h1 { margin: 0 0 6px 0; font-size: 1.5rem; letter-spacing: 0.04em;
              text-transform: uppercase; }
  .panel .sub { color: var(--muted); font-size: 0.9rem; margin-bottom: 24px; }
  .row {
    display: grid; grid-template-columns: 110px 1fr; gap: 12px;
    align-items: center; padding: 10px 0;
    border-bottom: 1px solid rgba(255,255,255,0.05);
  }
  .row:last-child { border-bottom: none; }
  .row .k { color: var(--muted); font-size: 0.85rem; text-transform: uppercase; }
  .row .v { font-weight: 600; font-size: 1.05rem; }
  .badge {
    display: inline-block; margin-left: 8px; padding: 2px 8px; border-radius: 4px;
    font-size: 0.7rem; background: rgba(76, 201, 240, 0.18); color: #4cc9f0;
    border: 1px solid rgba(76, 201, 240, 0.4); text-transform: uppercase;
    vertical-align: middle;
  }
</style>
</head>
<body>

<div class="scene">

  <div class="stoplight">
    <div class="housing">
      <div class="hmi-lamp hmi-red"    id="lamp-red"></div>
      <div class="hmi-lamp hmi-yellow" id="lamp-yel"></div>
      <div class="hmi-lamp hmi-green"  id="lamp-grn"></div>
    </div>
    <div class="pole"></div>
    <div class="base"></div>
  </div>

  <div class="panel">
    <h1>Stoplight <span class="badge">via lib</span></h1>
    <div class="sub">Rebuilt on browser-hmi.js — ~25 lines of JS</div>

    <div class="row">
      <div class="k">Conn</div>
      <div class="v"><span id="conn-pill" class="hmi-pill-off">disconnected</span></div>
    </div>
    <div class="row">
      <div class="k">State</div>
      <div class="v" id="state"></div>
    </div>
    <div class="row">
      <div class="k">Red</div>
      <div class="v"><span id="ind-red" class="hmi-pill-off">OFF</span></div>
    </div>
    <div class="row">
      <div class="k">Yellow</div>
      <div class="v"><span id="ind-yel" class="hmi-pill-off">OFF</span></div>
    </div>
    <div class="row">
      <div class="k">Green</div>
      <div class="v"><span id="ind-grn" class="hmi-pill-off">OFF</span></div>
    </div>

    <button class="hmi-button" id="btn-start" style="margin-top:24px; width:100%;">
      Toggle Switch
    </button>
  </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
<script src="../browser-hmi.js"></script>
<script>
  const hmi = new BrowserHmi({
    transport: 'mqtt',
    host: 'localhost',
    port: 9001,
    topicPrefix: 'plc/stoplight',
  });

  // Lamps + side-panel indicators all wired to the same channels.
  hmi.lamp('red',    '#lamp-red',  { color: 'red' });
  hmi.lamp('yellow', '#lamp-yel',  { color: 'yellow' });
  hmi.lamp('green',  '#lamp-grn',  { color: 'green' });

  hmi.indicator('red',    '#ind-red', { onText: 'ON', offText: 'OFF' });
  hmi.indicator('yellow', '#ind-yel', { onText: 'ON', offText: 'OFF' });
  hmi.indicator('green',  '#ind-grn', { onText: 'ON', offText: 'OFF' });

  // The PLC publishes `state` as a DInt (0/1/2/3); map to readable names.
  hmi.text('state', '#state', {
    map: { '0': 'Red', '1': 'RedYellow', '2': 'Green', '3': 'Yellow' },
  });

  // Tap the start switch.
  hmi.button('switch/set', '#btn-start', { value: '1' });

  hmi.onStatus((ok, msg) => {
    const pill = document.getElementById('conn-pill');
    pill.textContent = ok ? 'connected' : 'disconnected';
    pill.classList.toggle('hmi-pill-on', ok);
    pill.classList.toggle('hmi-pill-off', !ok);
  });

  hmi.connect();
</script>

</body>
</html>
